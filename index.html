<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>認知負荷訓練</title>
<meta name="description" content="運動中加入認知負荷的答題工具：數學、顏色干擾、圖形計數，點選或手勢作答。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#151a21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="認知負荷">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: one-hand phone tool. Setup = stacked option rows; Run = full-screen stage (dark "scoreboard" panel) over a thumb-zone answer pad. */
:root{
  --bg:#eef0ec; --surface:#ffffff; --ink:#14181d; --muted:#5b6470; --line:#d6dad3;
  --accent:#e2560e; --accent-ink:#ffffff; --ok:#1d9a52; --bad:#d4402e;
  --stage:#151a21; --stage-ink:#f1f3f6; --stage-dim:#8a94a1;
  --c-red:#ff5a4f; --c-blue:#4d8dff; --c-green:#3ecf6e; --c-yellow:#ffd23f;
  --f-display:"Barlow Condensed","Arial Narrow","Noto Sans TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1115; --surface:#171b21; --ink:#e8ebee; --muted:#9aa3ad; --line:#2a3038;
  --accent:#ff7a33; --accent-ink:#14181d; --ok:#3ecf6e; --bad:#ff5a4f;
  --stage:#0a0d11; --stage-ink:#f1f3f6; --stage-dim:#7f8995; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1115; --surface:#171b21; --ink:#e8ebee; --muted:#9aa3ad; --line:#2a3038;
  --accent:#ff7a33; --accent-ink:#14181d; --ok:#3ecf6e; --bad:#ff5a4f;
  --stage:#0a0d11; --stage-ink:#f1f3f6; --stage-dim:#7f8995; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:22px}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.01em;margin:0;text-wrap:balance}
header.top p{margin:6px 0 0;color:var(--muted);font-size:14px}
.group{display:flex;flex-direction:column;gap:8px}
.label{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0}
.chip span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500}
.chip input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{font-size:12px;opacity:.7;font-weight:400}
.text{width:100%;min-height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.toggle b{font-weight:500}
.toggle small{display:block;color:var(--muted);font-size:12px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.note{font-size:13px;color:var(--muted);margin:0}
.note.warn{color:var(--bad)}
.btn-main{min-height:60px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:.04em}
.btn-ghost{min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:500;padding:0 16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 140px}

.hist{display:flex;flex-direction:column;gap:0;border-top:1.5px solid var(--line)}
.hist .h{display:grid;grid-template-columns:1fr auto auto 40px;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.hist-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.link-btn{min-height:36px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;font-weight:500;color:var(--muted)}
.link-btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.del{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:18px}
.del:active{background:var(--line)}
.hist .h .meta{min-width:0;color:var(--muted);font-size:12px}
.num{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}

/* RUN */
#run{position:fixed;inset:0;background:var(--bg);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));z-index:5}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar .stat{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bar .stat span{color:var(--muted);font-size:15px;font-weight:600;margin-left:4px}
.stop{min-height:40px;padding:0 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700}
.timebar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:none}
.stagewrap{min-height:0;display:grid;border-radius:18px}
.stagewrap.g-wait{box-shadow:0 0 0 5px var(--c-yellow)}
.stagewrap.g-lost{box-shadow:0 0 0 5px var(--accent)}
.stage{container-type:size;background:var(--stage);color:var(--stage-ink);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--fit,1) * 3cqh);padding:12px;min-height:0;min-width:0;overflow:hidden;position:relative;transition:box-shadow .15s}
.stage.ok{box-shadow:inset 0 0 0 6px var(--ok)}
.stage.bad{box-shadow:inset 0 0 0 6px var(--bad)}
.stage .rule{font-size:calc(var(--fit,1) * 9cqh);letter-spacing:.1em;color:var(--stage);background:var(--stage-ink);padding:2px 16px;border-radius:8px;font-weight:900}
.big{font-family:var(--f-display);font-weight:700;font-size:min(calc(var(--fit,1) * 34cqh), var(--cap, 9999px));line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
/* gesture */
.gopts{display:flex;flex-direction:column;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-top:0;border-radius:0 0 12px 12px;margin-top:-10px;background:var(--surface)}
.gopts .sub{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.gtest{display:flex;flex-direction:column;gap:10px}
.gtest canvas{width:100%;aspect-ratio:4/3;max-width:100%;background:var(--stage);border-radius:12px}
.gind{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gind span{min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1.5px solid var(--line);font-weight:900;font-size:20px;color:var(--muted)}
.gind span.on-l{background:var(--ok);border-color:var(--ok);color:#fff}
.gind span.on-r{background:var(--bad);border-color:var(--bad);color:#fff}
.gbox{position:relative;height:64px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:3px solid var(--accent);background:var(--stage);flex:none}
.gbox.ok{border-color:var(--ok)}
.gbox.wait{border-color:var(--c-yellow)}
.gbox canvas{width:100%;height:100%;display:block}
.gbox b{position:absolute;left:0;right:0;bottom:0;font-size:11px;text-align:center;background:rgba(0,0,0,.6);color:#fff;padding:1px 0}
.pad button small{display:block;font-family:var(--f-body);font-size:max(14px,.42em);font-weight:700;opacity:.85;line-height:1.2}
.pad button{box-shadow:inset 0 calc(var(--p,0) * -400px) 0 rgba(127,127,127,.35)}
.pad .tf-y,.pad .tf-n{box-shadow:inset 0 calc(var(--p,0) * -400px) 0 rgba(255,255,255,.35)}
.pad.g3x{grid-template-columns:repeat(3,1fr)}
.pad .sw.col{flex-direction:column;gap:2px}
.gmsg{font-size:clamp(20px,6vw,32px);font-weight:900;text-align:center;text-wrap:balance}
.gmsg small{display:block;font-size:.55em;font-weight:500;color:var(--stage-dim);margin-top:8px}
.count{font-family:var(--f-display);font-weight:700;font-size:min(calc(var(--fit,1) * 62cqh), var(--cap, 9999px));line-height:1;font-variant-numeric:tabular-nums}
.word{font-weight:900;font-size:min(calc(var(--fit,1) * 50cqh), var(--cap, 9999px));line-height:1}
.field{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--fit,1) * 2cqh);max-width:100%}
.field svg{width:calc(var(--fit,1) * 17cqh);height:calc(var(--fit,1) * 17cqh)}
.prompt{font-size:calc(var(--fit,1) * 13cqh);font-weight:900;line-height:1.2;text-align:center;text-wrap:balance;max-width:100%}
.pad{display:grid;gap:8px}
.pad.g2{grid-template-columns:1fr 1fr}
.pad.g3{grid-template-columns:repeat(3,1fr)}
.pad button{min-height:clamp(100px,14.5vh,160px);border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums}
.pad button:active{transform:scale(.97)}
.pad.kp button{min-height:clamp(70px,9.8vh,108px);font-size:42px}
.pad .sw{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-body);font-size:40px;font-weight:900}
.pad .sw i{width:26px;height:26px;border-radius:50%;flex:none}
.pad .tf-y{background:var(--ok);color:#fff;border-color:transparent;font-family:var(--f-body);font-size:38px}
.pad .tf-n{background:var(--bad);color:#fff;border-color:transparent;font-family:var(--f-body);font-size:38px}
.pad .go{background:var(--accent);color:var(--accent-ink);border-color:transparent}
/* 橫向：題目在左、作答區在右，鏡頭可以拍到更寬的範圍 */
@media (orientation: landscape){
  #run{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);column-gap:12px}
  #run .bar,#run .timebar{grid-column:1 / -1}
  #run .stagewrap{grid-column:1;grid-row:3}
  #run .pad{grid-column:2;grid-row:3;grid-auto-rows:minmax(0,1fr);align-content:stretch;min-height:0}
  #run .pad button,#run .pad.kp button{min-height:0}
  #run .pad .entry{min-height:0}
  .gbox{height:48px}
}
.entry{grid-column:1/-1;min-height:48px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:36px;font-weight:700;border-bottom:2px solid var(--line);font-variant-numeric:tabular-nums}

/* RESULT */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--line)}
.kpis div{padding:14px 4px;display:flex;flex-direction:column;gap:2px}
.kpis div:nth-child(odd){border-right:1px solid var(--line);padding-right:14px}
.kpis div:nth-child(even){padding-left:14px}
.kpis div:nth-child(-n+2){border-bottom:1px solid var(--line)}
.kpis b{font-family:var(--f-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.kpis span{font-size:12px;color:var(--muted);letter-spacing:.08em}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px 8px 6px 0;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.y{color:var(--ok);font-weight:700}
.tbl td.n{color:var(--bad);font-weight:700}
textarea.csv{width:100%;min-height:120px;font:12px ui-monospace,monospace;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:8px}
@media (prefers-reduced-motion: reduce){.stage{transition:none}.pad button:active{transform:none}}
</style>

</head>
<body>
<section id="setup" class="wrap">
  <header class="top">
    <h1>認知負荷訓練</h1>
    <p>動作中同時答題。選手點選作答；手不方便碰螢幕時，開啟手勢作答用舉手回答。</p>
  </header>

  <div class="group">
    <label class="label" for="athlete">選手</label>
    <input id="athlete" class="text" placeholder="名字（選填，用來分辨紀錄）" autocomplete="off">
  </div>

  <div class="group">
    <div class="label">題型（可複選，多選＝隨機切換）</div>
    <div class="chips" id="types">
      <label class="chip"><input type="checkbox" id="t-math" value="math" checked><span>數學</span></label>
      <label class="chip"><input type="checkbox" id="t-stroop" value="stroop" checked><span>顏色干擾 <small>Stroop</small></span></label>
      <label class="chip"><input type="checkbox" id="t-count" value="count"><span>圖形計數</span></label>
    </div>
  </div>

  <div class="group">
    <div class="label">作答方式（可複選，多選＝隨機切換）</div>
    <div class="chips" id="modes">
      <label class="chip"><input type="checkbox" id="m-choice" value="choice" checked><span>選擇題</span></label>
      <label class="chip"><input type="checkbox" id="m-tf" value="tf"><span>是非題</span></label>
      <label class="chip"><input type="checkbox" id="m-short" value="short"><span>簡答題</span></label>
    </div>
    <p class="note" id="modeNote" hidden>手勢作答開啟中：不出簡答題。選擇題改成三選一（左手、雙手、右手），數學題一律出是非題。</p>
  </div>

  <div class="group">
    <div class="label">手勢作答</div>
    <label class="toggle" for="gesture"><span><b>舉手回答</b><small>手腕舉到肩膀高度以上。是非題：左手＝對、右手＝錯。三選一：左手、雙手、右手對應左、中、右。手機立在 2–3 公尺外，可以橫放</small></span><input type="checkbox" id="gesture"></label>
    <div class="gopts" id="gopts" hidden>
      <div class="sub">舉手要停留多久才算</div>
      <div class="chips">
        <label class="chip"><input type="radio" name="hold" id="h-200" value="200"><span>0.2 秒</span></label>
        <label class="chip"><input type="radio" name="hold" id="h-300" value="300" checked><span>0.3 秒</span></label>
        <label class="chip"><input type="radio" name="hold" id="h-500" value="500"><span>0.5 秒</span></label>
      </div>
      <p class="note">跑動時手臂擺動容易誤觸，誤觸多就改長一點。</p>
      <label class="toggle" for="gswap"><span><b>左右對調</b><small>測試時舉左手卻亮「右手」，就打開這個</small></span><input type="checkbox" id="gswap"></label>
      <button class="btn-ghost" id="gtestBtn">測試手勢與鏡頭位置</button>
      <div class="gtest" id="gtest" hidden>
        <canvas id="gtestCanvas" width="480" height="360"></canvas>
        <div class="gind"><span id="gindL">左手 ↑ 對</span><span id="gindR">右手 ↑ 錯</span></div>
        <p class="note" id="gtestNote"></p>
        <button class="btn-ghost" id="gtestClose">關閉測試</button>
      </div>
    </div>
  </div>

  <div class="group">
    <div class="label">難度</div>
    <div class="chips">
      <label class="chip"><input type="radio" name="level" id="l-1" value="1" checked><span>1 基礎</span></label>
      <label class="chip"><input type="radio" name="level" id="l-2" value="2"><span>2 進階</span></label>
      <label class="chip"><input type="radio" name="level" id="l-3" value="3"><span>3 高壓</span></label>
    </div>
    <p class="note" id="levelNote"></p>
  </div>

  <div class="group">
    <div class="label">每題時限</div>
    <div class="chips">
      <label class="chip"><input type="radio" name="limit" id="q-0" value="0" checked><span>不限</span></label>
      <label class="chip"><input type="radio" name="limit" id="q-3" value="3"><span>3 秒</span></label>
      <label class="chip"><input type="radio" name="limit" id="q-5" value="5"><span>5 秒</span></label>
      <label class="chip"><input type="radio" name="limit" id="q-8" value="8"><span>8 秒</span></label>
    </div>
  </div>

  <div class="group">
    <div class="label">訓練長度</div>
    <div class="chips">
      <label class="chip"><input type="radio" name="len" id="n-20" value="q20" checked><span>20 題</span></label>
      <label class="chip"><input type="radio" name="len" id="n-60" value="s60"><span>60 秒</span></label>
      <label class="chip"><input type="radio" name="len" id="n-120" value="s120"><span>2 分鐘</span></label>
      <label class="chip"><input type="radio" name="len" id="n-free" value="free"><span>手動停止</span></label>
    </div>
  </div>

  <div class="group">
    <div class="label">語音</div>
    <label class="toggle" for="voiceOut"><span><b>唸出題目</b><small>眼睛離開螢幕時用；顏色干擾題仍需看螢幕</small></span><input type="checkbox" id="voiceOut"></label>
  </div>

  <button class="btn-main" id="startBtn">開始</button>

  <div class="group">
    <div class="hist-head"><div class="label">最近紀錄（只存在這台裝置）</div><button class="link-btn" id="clearHist" hidden>清除全部</button></div>
    <div class="hist" id="hist"></div>
  </div>
</section>

<section id="run" hidden>
  <div class="bar">
    <div class="stat" id="rCount">1<span>題</span></div>
    <div class="gbox" id="gbox" hidden><canvas id="gboxCanvas" width="320" height="240"></canvas><b id="gboxText"></b></div>
    <div class="stat" id="rClock">0:00</div>
    <button class="stop" id="stopBtn">停止</button>
  </div>
  <div class="timebar"><i id="tbar"></i></div>
  <div class="stagewrap" id="stagewrap"><div class="stage" id="stage"></div></div>
  <div class="pad" id="pad"></div>
</section>

<section id="result" class="wrap" hidden>
  <header class="top">
    <h1 id="resTitle">本次結果</h1>
    <p id="resMeta"></p>
  </header>
  <div class="kpis">
    <div><b id="kAcc">–</b><span>正確率</span></div>
    <div><b id="kRt">–</b><span>平均反應（答對，秒）</span></div>
    <div><b id="kN">–</b><span>作答題數</span></div>
    <div><b id="kTo">–</b><span>逾時</span></div>
  </div>
  <div class="group">
    <div class="label">各題型</div>
    <div class="tbl"><table id="byType"></table></div>
  </div>
  <div class="row">
    <button class="btn-main" id="againBtn">再練一次</button>
    <button class="btn-ghost" id="backBtn">回設定</button>
  </div>
  <div class="group">
    <div class="label">逐題紀錄</div>
    <div class="tbl"><table id="detail"></table></div>
  </div>
  <div class="row">
    <button class="btn-ghost" id="csvBtn">複製 CSV（貼到試算表）</button>
  </div>
  <textarea class="csv" id="csvBox" hidden readonly></textarea>
</section>

<script>
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const COLORS = [
  {k:'red', n:'紅', v:'var(--c-red)'},
  {k:'blue', n:'藍', v:'var(--c-blue)'},
  {k:'green', n:'綠', v:'var(--c-green)'},
  {k:'yellow', n:'黃', v:'var(--c-yellow)'}
];
const colorByK = k => COLORS.find(c => c.k === k);
const SHAPES = [
  {k:'circle', n:'圓形', svg:'<circle cx="50" cy="50" r="40"/>'},
  {k:'tri', n:'三角形', svg:'<polygon points="50,8 93,88 7,88"/>'},
  {k:'square', n:'方形', svg:'<rect x="12" y="12" width="76" height="76"/>'},
  {k:'star', n:'星形', svg:'<polygon points="50,6 61,38 95,38 67,58 78,92 50,71 22,92 33,58 5,38 39,38"/>'}
];
const TYPE_NAME = {math:'數學', stroop:'顏色干擾', count:'圖形計數'};
const MODE_NAME = {choice:'選擇', tf:'是非', short:'簡答'};
const LEVEL_NOTE = {
  1:'數學：個位數加減。顏色：多數字色一致。計數：只數形狀。',
  2:'數學：二位數加減、九九乘法。顏色：多數字色衝突。計數：數顏色或形狀。',
  3:'數學：二位數混合運算。顏色：規則隨機切換「看顏色／讀字」。計數：顏色＋形狀同時符合。'
};

/* ---------- question generators ---------- */
function numOptions(ans, n = 4){
  const set = new Set([ans]);
  const spread = Math.max(2, Math.ceil(ans*0.15)+1);
  let guard = 0;
  while(set.size < n && guard++ < 200){
    const d = ans + pick([-1,1]) * rnd(1, spread);
    if(d >= 0) set.add(d);
  }
  let x = ans + 1; while(set.size < n){ set.add(x++); }
  return shuffle([...set]);
}
/* 數學干擾選項：2×2 格子。正解 ans、ans+t（十位不同）、ans+u（個位不同）、ans+t+u（都不同）。
   每個位數上，正解的數字都至少和另一個選項相同，所以只看個位或只看十位都選不出來，
   必須兩個位數（含進位）都算對。四個選項構成對稱的長方形，從選項本身也看不出哪個是正解。 */
function digitsPaired(opts, ans){
  for(let pos = 1; pos <= 100; pos *= 10){
    const dig = n => Math.floor(n / pos) % 10;
    if(opts.filter(o => dig(o) === dig(ans)).length < 2) return false;
  }
  return true;
}
function gridDistractors(ans){
  for(let tries = 0; tries < 20; tries++){
    const d = ans % 10, us = [];
    if(d <= 7) us.push(1, 2);
    if(d >= 2) us.push(-1, -2);
    const u = pick(us);
    const t = pick(ans >= 10 ? [10, -10] : [10]);
    const opts = [ans, ans + t, ans + u, ans + t + u];
    if(digitsPaired(opts, ans)) return opts.slice(1);
  }
  return null;
}
function mathOptions(ans, level){
  const g = level === 1 ? null : gridDistractors(ans);
  return g ? shuffle([ans, ...g]) : numOptions(ans);
}
// 是非題的錯誤答案：只錯個位、只錯十位、兩個都錯，三種機率相同
function mathWrong(ans, level){
  const g = level === 1 ? null : gridDistractors(ans);
  return g ? pick(g) : wrongNear(ans);
}
function wrongNear(ans){
  let v = ans + pick([-1,1]) * rnd(1,3);
  if(v < 0 || v === ans) v = ans + rnd(1,3);
  return v;
}

function genMath(level, mode, three){
  // 三個選項無法讓每個位數都「至少兩個選項相同」，正解會從選項結構被猜出來，所以手勢模式的數學一律出是非題
  if(three && mode === 'choice') mode = 'tf';
  let a, b, op;
  if(level === 1){ op = pick(['+','−']); a = rnd(1,9); b = rnd(1,9); }
  else if(level === 2){ op = pick(['+','−','×']); if(op==='×'){ a=rnd(2,9); b=rnd(2,9); } else { a=rnd(10,50); b=rnd(2,19); } }
  else { op = pick(['+','−','×']); if(op==='×'){ a=rnd(3,12); b=rnd(3,9); } else { a=rnd(20,99); b=rnd(11,89); } }
  if(op === '−' && b > a) [a,b] = [b,a];
  const ans = op==='+' ? a+b : op==='−' ? a-b : a*b;
  const say = {'+':'加','−':'減','×':'乘'}[op];
  if(mode === 'tf'){
    const truth = Math.random() < 0.5;
    const shown = truth ? ans : mathWrong(ans, level);
    return {type:'math', mode, kind:'bool', answer:truth,
      stage:`<div class="big">${a} ${op} ${b} = ${shown}</div>`,
      prompt:'算式對嗎？', speak:`${a}${say}${b}，等於${shown}`, label:`${a}${op}${b}=${shown}`};
  }
  return {type:'math', mode, kind:'num', answer:ans, options: mode==='choice' ? mathOptions(ans, level) : null,
    stage:`<div class="big">${a} ${op} ${b}</div>`, prompt:'答案是？', speak:`${a}${say}${b}`, label:`${a}${op}${b}`};
}

function genStroop(level, mode, three){
  const word = pick(COLORS);
  const pCong = level===1 ? 0.4 : level===2 ? 0.2 : 0.15;
  const ink = Math.random() < pCong ? word : pick(COLORS.filter(c => c !== word));
  const rule = level===3 && Math.random() < 0.4 ? 'word' : 'ink';
  const target = rule==='ink' ? ink : word;
  const ruleText = rule==='ink' ? '看顏色' : '讀字';
  const stage = `${level===3 ? `<div class="rule">${ruleText}</div>` : ''}<div class="word" style="color:${ink.v}">${word.n}</div>`;
  const label = `「${word.n}」字・${ink.n}色・${ruleText}`;
  if(mode === 'tf'){
    const truth = Math.random() < 0.5;
    const shown = truth ? target : pick(COLORS.filter(c => c !== target));
    return {type:'stroop', mode, kind:'bool', answer:truth, stage,
      prompt: rule==='ink' ? `字的顏色是「${shown.n}」？` : `這個字是「${shown.n}」？`,
      speak: null, label: `${label}・問${shown.n}`};
  }
  const options = three ? shuffle([target.k, ...shuffle(COLORS.filter(c => c !== target)).slice(0,2).map(c => c.k)]) : null;
  return {type:'stroop', mode, kind:'color', answer:target.k, options, stage,
    prompt: rule==='ink' ? '字的顏色是？' : '這是什麼字？', speak:null, label};
}

function genCount(level, mode, three){
  const n = level===1 ? rnd(5,7) : level===2 ? rnd(7,10) : rnd(9,13);
  const items = [];
  for(let i=0;i<n;i++) items.push({s:pick(SHAPES), c: level===1 ? null : pick(COLORS)});
  let dim = level===1 ? 'shape' : level===2 ? pick(['shape','color']) : 'both';
  const ts = pick(SHAPES), tc = pick(COLORS);
  const match = it => dim==='shape' ? it.s===ts : dim==='color' ? it.c===tc : (it.s===ts && it.c===tc);
  if(!items.some(match)){ items[0] = {s:ts, c: dim==='shape' && level===1 ? null : tc}; }
  if(dim==='shape' && level>1){ /* colors are just noise */ }
  const count = items.filter(match).length;
  const field = items.map(it => `<svg viewBox="0 0 100 100" aria-hidden="true" fill="${it.c ? it.c.v : 'var(--stage-ink)'}">${it.s.svg}</svg>`).join('');
  const what = dim==='shape' ? ts.n : dim==='color' ? `${tc.n}色` : `${tc.n}色${ts.n}`;
  const stage = `<div class="field">${field}</div>`;
  if(mode === 'tf'){
    const truth = Math.random() < 0.5;
    const s2 = truth ? count : wrongNear(count);
    return {type:'count', mode, kind:'bool', answer:truth, stage,
      prompt:`${what}有 ${s2} 個？`, speak:null, label:`${what}${count}個・問${s2}`};
  }
  return {type:'count', mode, kind:'num', answer:count, options: mode==='choice' ? numOptions(count, three ? 3 : 4) : null,
    stage, prompt:`${what}有幾個？`, speak:null, label:`${what}有${count}個`};
}
const GEN = {math:genMath, stroop:genStroop, count:genCount};

/* ---------- settings ---------- */
function readSettings(){
  const types = [...document.querySelectorAll('#types input:checked')].map(i => i.value);
  return {
    name: $('#athlete').value.trim(),
    types: types.length ? types : ['math'],
    modes: (m => m.length ? m : [$('#gesture').checked ? 'tf' : 'choice'])([...document.querySelectorAll('#modes input:checked')].map(i => i.value).filter(v => !($('#gesture').checked && v === 'short'))),
    gesture: $('#gesture').checked,
    hold: +document.querySelector('input[name=hold]:checked').value,
    gswap: $('#gswap').checked,
    level: +document.querySelector('input[name=level]:checked').value,
    limit: +document.querySelector('input[name=limit]:checked').value,
    len: document.querySelector('input[name=len]:checked').value,
    voiceOut: $('#voiceOut').checked
  };
}
const PREF_KEY = 'clt-settings', HIST_KEY = 'clt-history';
function savePrefs(s){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(s)); }catch(e){} }
function loadPrefs(){
  let s; try{ s = JSON.parse(localStorage.getItem(PREF_KEY) || 'null'); }catch(e){ s = null; }
  if(!s) return;
  $('#athlete').value = s.name || '';
  document.querySelectorAll('#types input').forEach(i => i.checked = s.types.includes(i.value));
  const set = (name, v) => { const el = document.querySelector(`input[name=${name}][value="${v}"]`); if(el) el.checked = true; };
  // 舊版設定只存一個 mode（mix＝全選），這裡轉成新版的多選
  const modes = s.modes || (s.mode === 'mix' ? ['choice','tf','short'] : [s.mode || 'choice']);
  document.querySelectorAll('#modes input').forEach(i => i.checked = modes.includes(i.value));
  set('level', s.level); set('limit', s.limit); set('len', s.len);
  $('#voiceOut').checked = !!s.voiceOut;
  $('#gesture').checked = !!s.gesture; $('#gswap').checked = !!s.gswap;
  if(s.hold) set('hold', s.hold);
}
function updateLevelNote(){ $('#levelNote').textContent = LEVEL_NOTE[document.querySelector('input[name=level]:checked').value]; }

/* ---------- audio feedback ---------- */
let actx = null;
function beep(ok){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = ok === null ? 520 : ok ? 880 : 220; o.type = ok === false ? 'square' : 'sine';
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (ok === false ? 0.25 : 0.12));
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.3);
  }catch(e){}
}

/* ---------- speech out ---------- */
function speak(text, done){
  const synth = window.speechSynthesis;
  if(!synth || !text){ done && done(); return; }
  let finished = false;
  const fin = () => { if(finished) return; finished = true; done && done(); };
  const waitIdle = n => { if(!synth.speaking || n <= 0) fin(); else setTimeout(() => waitIdle(n - 1), 150); };
  try{
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-TW'; u.rate = 1.1; u.volume = 1; u.pitch = 1;
    u.onend = () => setTimeout(fin, 250);   // 等喇叭餘音散掉再開麥克風
    u.onerror = fin;
    synth.speak(u);
    setTimeout(() => waitIdle(20), 1500 + text.length * 350);
  }catch(e){ fin(); }
}

/* ---------- gesture (pose) ---------- */
// 用 Google MediaPipe Pose 偵測肩膀與手腕位置。第一次使用要下載程式與模型（約 15 MB），之後會存在手機裡。
const MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21';
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const G = {lm:null, loading:null, stream:null, video:null, running:false, raf:0, lastT:-1, target:null, onPose:null};

function gErrText(err){
  const n = err && err.name;
  if(n === 'NotAllowedError' || n === 'SecurityError') return '相機權限被拒絕。請在瀏覽器設定允許相機，或用安裝到手機的 App 開啟。';
  if(n === 'NotFoundError' || n === 'OverconstrainedError') return '找不到前鏡頭。';
  if(n === 'NotReadableError') return '相機正被其他 App 使用，請關掉其他用到相機的 App。';
  return '第一次使用需要網路下載模型，請確認連線後再試。';
}
async function gInit(status){
  if(!G.lm){
    if(!G.loading){
      G.loading = (async () => {
        const vision = await import(MP_BASE + '/vision_bundle.mjs');
        const files = await vision.FilesetResolver.forVisionTasks(MP_BASE + '/wasm');
        const opts = d => ({baseOptions:{modelAssetPath:MP_MODEL, delegate:d}, runningMode:'VIDEO', numPoses:1,
          minPoseDetectionConfidence:0.5, minPosePresenceConfidence:0.5, minTrackingConfidence:0.5});
        try{ return await vision.PoseLandmarker.createFromOptions(files, opts('GPU')); }
        catch(e){ return await vision.PoseLandmarker.createFromOptions(files, opts('CPU')); }
      })();
    }
    status('載入手勢辨識…（第一次約需 10–30 秒）');
    try{ G.lm = await G.loading; }catch(e){ G.loading = null; throw e; }
  }
  if(!G.stream){
    status('開啟前鏡頭…');
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ const e = new Error('no camera'); e.name = 'NotFoundError'; throw e; }
    G.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false});
    const v = document.createElement('video');
    v.playsInline = true; v.muted = true; v.setAttribute('playsinline', ''); v.srcObject = G.stream;
    await v.play();
    G.video = v; G.lastT = -1;
  }
  gLoop();
}
function gLoop(){
  if(G.running) return;
  G.running = true;
  const step = () => {
    if(!G.running) return;
    G.raf = requestAnimationFrame(step);
    const v = G.video;
    if(!v || v.readyState < 2 || v.currentTime === G.lastT) return;
    G.lastT = v.currentTime;
    const now = performance.now();
    let pose = null;
    try{ G.lm.detectForVideo(v, now, res => { pose = res.landmarks && res.landmarks[0] ? res.landmarks[0].map(p => ({x:p.x, y:p.y, visibility:p.visibility})) : null; }); }catch(e){ return; }
    const g = gestureRead(pose, $('#gswap').checked);
    gDraw(pose, g);
    if(G.onPose) G.onPose(g, now);
  };
  step();
}
function gStop(){
  G.running = false; cancelAnimationFrame(G.raf); G.onPose = null;
  if(G.stream) G.stream.getTracks().forEach(t => t.stop());
  G.stream = null; G.video = null; G.lastT = -1;
}
// 只看「手腕是否高於或等於同側肩膀」。座標 y 向下，所以 y 越小越高。
// MediaPipe 的左右是「被拍的人自己的左右」；若手機鏡頭反過來，用「左右對調」修正。
function gestureRead(pose, swap){
  if(!pose) return {present:false, left:false, right:false};
  const seen = p => p && (p.visibility == null || p.visibility > 0.5);
  const up = (w, sh) => seen(w) && seen(sh) && w.y <= sh.y;
  let L = up(pose[15], pose[11]), R = up(pose[16], pose[12]);
  if(swap){ const t = L; L = R; R = t; }
  return {present: seen(pose[11]) && seen(pose[12]), left:L, right:R};
}
// 判定規則：只有一隻手舉起、持續到設定的停留時間才算回答；雙手同時舉起不算。
// 每題開始、每次回答之後，都要先看到雙手放下，才接受下一次回答，避免上一題的手延續到下一題。
function gestureMachine(){
  let side = null, since = 0, lastUp = 0, needRelease = true, downSince = 0;
  return {
    reset(){ side = null; needRelease = true; downSince = 0; },
    step(g, now, holdMs, allowBoth){
      const one = g.left && g.right ? (allowBoth ? 'both' : null) : g.left ? 'left' : g.right ? 'right' : null;
      const none = !g.left && !g.right;
      if(needRelease){
        if(none && g.present){ if(!downSince) downSince = now; if(now - downSince >= 150) needRelease = false; }
        else downSince = 0;
        side = null;
        return {state:'release', progress:0};
      }
      if(!one){
        if(side && now - lastUp < 120) return {state:'hold', side, progress:Math.min(1, (now - since) / holdMs)};  // 容許一兩格辨識閃斷
        side = null;
        return {state: g.present ? 'ready' : 'lost', progress:0};
      }
      lastUp = now;
      if(one !== side){ side = one; since = now; }
      const progress = (now - since) / holdMs;
      if(progress >= 1){
        const t0 = since, fired = side;
        side = null; needRelease = true; downSince = 0;
        return {state:'fire', side:fired, t0, progress:1};
      }
      return {state:'hold', side, progress};
    }
  };
}
const GM = gestureMachine();
function gUse(where){
  G.target = where === 'run' ? $('#gboxCanvas') : $('#gtestCanvas');
  G.onPose = where === 'run' ? onRunPose : onTestPose;
}
function gDraw(pose, g){
  const c = G.target, v = G.video; if(!c || !v) return;
  const vw = v.videoWidth, vh = v.videoHeight;
  if(vw && vh){
    const want = Math.round(c.width * vh / vw);
    if(Math.abs(c.height - want) > 1){ c.height = want; c.style.aspectRatio = `${vw} / ${vh}`; if(c.parentElement && c.parentElement.id === 'gbox') c.parentElement.style.aspectRatio = `${vw} / ${vh}`; }
  }
  const ctx = c.getContext('2d'), w = c.width, h = c.height;
  ctx.save();
  ctx.translate(w, 0); ctx.scale(-1, 1);   // 像照鏡子一樣顯示：舉左手，畫面左邊的手舉起
  ctx.drawImage(v, 0, 0, w, h);
  if(pose){
    const sh = [pose[11], pose[12]];
    const y = (sh[0].y + sh[1].y) / 2 * h;
    ctx.strokeStyle = 'rgba(255,210,63,.9)'; ctx.lineWidth = Math.max(2, w / 160); ctx.setLineDash([w/40, w/60]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); ctx.setLineDash([]);
    const dot = (p, col) => { if(!p) return; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(p.x * w, p.y * h, Math.max(4, w / 50), 0, Math.PI * 2); ctx.fill(); };
    dot(pose[11], '#ffffff'); dot(pose[12], '#ffffff');
    const swap = $('#gswap').checked;
    dot(pose[swap ? 16 : 15], g.left ? '#3ecf6e' : '#9aa3ad');
    dot(pose[swap ? 15 : 16], g.right ? '#ff5a4f' : '#9aa3ad');
  }
  ctx.restore();
}
function onTestPose(g){
  $('#gindL').classList.toggle('on-l', g.left);
  $('#gindR').classList.toggle('on-r', g.right);
  $('#gtestNote').textContent = !g.present ? '看不到肩膀：退後一點，讓鏡頭拍到上半身。' :
    (g.left && g.right) ? '雙手同時舉起不算回答。' : '黃色虛線是肩膀高度，手腕要舉到線以上。';
}
function onRunPose(g, now){
  const q = S && S.cur;
  const three = !!(q && q.options && q.options.length === 3);
  const answerable = S && S.active && !S.counting && !S.locked && q && (q.kind === 'bool' || three);
  const r = answerable ? GM.step(g, now, S.st.hold, three) : {state: g.present ? 'idle' : 'lost', progress:0};
  const box = $('#gbox'), txt = $('#gboxText');
  const st = g.present ? r.state : 'lost';
  box.className = 'gbox' + (st === 'lost' ? '' : st === 'release' ? ' wait' : ' ok');
  txt.textContent = st === 'lost' ? '看不到人' : st === 'release' ? '先放下雙手' : st === 'hold' ? '確認中…' : '可以作答';
  // 遠處也看得到的狀態：題目區外框黃色＝先放下雙手、橘色＝鏡頭看不到人
  $('#stagewrap').className = 'stagewrap' + (st === 'lost' ? ' g-lost' : st === 'release' ? ' g-wait' : '');
  const idx = three ? {left:0, both:1, right:2} : {left:0, right:1};
  const btns = [...document.querySelectorAll('#pad button')];
  btns.forEach((b, i) => b.style.setProperty('--p', idx[r.side] === i ? Math.min(1, r.progress) : 0));
  if(r.state === 'fire'){
    if(q.kind === 'bool') submit(r.side === 'left', 'gesture', r.t0);
    else {
      const v = q.options[idx[r.side]];
      submit(q.kind === 'color' ? v : +v, 'gesture', r.t0);
    }
  }
}

/* ---------- session ---------- */
let S = null, wakeLock = null, raf = 0;
const LEN_MS = {s60:60000, s120:120000};

function show(id){ ['setup','run','result'].forEach(x => $('#'+x).hidden = (x !== id)); window.scrollTo(0,0); }

function startSession(){
  const st = readSettings(); savePrefs(st);
  S = {st, log:[], t0:0, active:true, counting:true, cur:null, locked:true, shownAt:0, qStart:0, timer:0, entry:''};
  show('run');
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').then(l => wakeLock = l).catch(()=>{}); }catch(e){}
  // 3 秒倒數：讓選手先進入動作再開始出題；時間從倒數結束才開始算
  const sess = S;
  $('#rCount').innerHTML = `0<span>題</span>`;
  $('#rClock').textContent = '0:00';
  $('#tbar').style.transform = 'scaleX(1)';
  $('#pad').className = 'pad'; $('#pad').innerHTML = '';
  const stage = $('#stage'); stage.className = 'stage';
  $('#gbox').hidden = !st.gesture;
  if(st.gesture){
    gUse('run');
    gInit(msg => { stage.innerHTML = `<div class="gmsg">${esc(msg)}</div>`; })
      .then(() => { if(S === sess && sess.active) runCountdown(sess, stage); else gStop(); })
      .catch(err => { if(S === sess && sess.active) stage.innerHTML = `<div class="gmsg">手勢辨識無法啟動<small>${esc(gErrText(err))}</small></div>`; });
    return;
  }
  runCountdown(sess, stage);
}
function runCountdown(sess, stage){
  let n = 3;
  const tick = () => {
    if(S !== sess || !sess.active) return;
    if(n === 0){
      sess.counting = false; sess.t0 = performance.now();
      beep(true); nextQ(); loop();
      return;
    }
    stage.innerHTML = `<div class="rule">準備</div><div class="count">${n}</div>`;
    fitStage();
    beep(null);
    n--; sess.cdTimer = setTimeout(tick, 1000);
  };
  tick();
}



function nextQ(){
  if(!S || !S.active) return;
  const st = S.st;
  if(st.len === 'q20' && S.log.length >= 20) return endSession();
  if(LEN_MS[st.len] && performance.now() - S.t0 >= LEN_MS[st.len]) return endSession();
  const type = pick(st.types);
  S.cur = GEN[type](st.level, pick(st.modes), st.gesture);
  S.entry = ''; S.qStart = 0;
  renderQ();
  // 題目一出現就接受作答（朗讀中也可以），反應時間從題目出現開始算
  S.shownAt = S.qStart = performance.now(); S.locked = false;
  if(st.gesture) GM.reset();
  const q = S.cur;
  const begin = () => {
    if(!S || !S.active || S.cur !== q || S.locked) return;
    if(st.limit){ clearTimeout(S.timer); S.timer = setTimeout(onTimeout, st.limit * 1000); }
  };
  if(st.voiceOut) speak(S.cur.speak || S.cur.prompt, begin); else begin();
}

// 把題目字放到最大：先用最大字級，放不下就逐步縮小，直到題目區裝得下
function fitStage(){
  const st = $('#stage');
  if(!st || $('#run').hidden) return;
  // 從偏大的字級開始（有空間就放大），放不下再逐步縮小
  let f = 1.8; st.style.setProperty('--fit', f);
  const inner = () => st.clientWidth - 24;
  // 不換行的大字（算式、Stroop 字、倒數）另外設寬度上限，剛好塞滿寬度，不拖累其他文字
  st.querySelectorAll('.big,.word,.count').forEach(el => {
    el.style.removeProperty('--cap');
    const w = el.getBoundingClientRect().width, fs = parseFloat(getComputedStyle(el).fontSize);
    if(w > 0 && fs > 0) el.style.setProperty('--cap', (inner() * 0.97 * fs / w).toFixed(1) + 'px');
  });
  const over = () => st.scrollHeight > st.clientHeight + 1 ||
    [...st.children].some(el => el.getBoundingClientRect().width > inner() + 1 || el.scrollWidth > el.clientWidth + 1);
  for(let i = 0; i < 40 && over(); i++){ f *= 0.93; st.style.setProperty('--fit', f.toFixed(3)); }
  // 數學題的重點是算式：「算式對嗎？」這類固定提示不要比算式大
  const big = st.querySelector('.big'), pr = st.querySelector('.prompt');
  if(big && pr){
    const cap = parseFloat(getComputedStyle(big).fontSize) * 0.55;
    if(parseFloat(getComputedStyle(pr).fontSize) > cap) pr.style.fontSize = cap.toFixed(1) + 'px';
  }
}
let fitTimer = 0;
window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitStage, 120); });
function renderQ(){
  const q = S.cur;
  $('#rCount').innerHTML = `${S.log.length + 1}<span>題</span>`;
  const stage = $('#stage');
  stage.className = 'stage';
  stage.innerHTML = q.stage + `<div class="prompt">${esc(q.prompt)}</div>`;
  const pad = $('#pad');
  const g = S.st.gesture;
  const HANDS = ['舉左手','舉雙手','舉右手'];
  if(q.kind === 'bool'){
    pad.className = 'pad g2';
    pad.innerHTML = `<button class="tf-y" data-v="1">${g ? '<small>舉左手</small>' : ''}對 ✓</button><button class="tf-n" data-v="0">${g ? '<small>舉右手</small>' : ''}錯 ✕</button>`;
  } else if(q.kind === 'color' && q.options){
    // 手勢三選一：左手＝左邊、雙手＝中間、右手＝右邊
    pad.className = 'pad g3x';
    const dot = S.st.level === 1;
    pad.innerHTML = q.options.map((k, i) => { const c = colorByK(k); return `<button class="sw col" data-v="${c.k}"><small>${HANDS[i]}</small><span>${dot ? `<i style="background:${c.v};display:inline-block;vertical-align:middle;margin-right:6px"></i>` : ''}${c.n}</span></button>`; }).join('');
  } else if(q.kind === 'color'){
    pad.className = 'pad g2';
    // 難度 1 保留色點方便入門；難度 2、3 只有文字，不能靠「顏色對顏色」配對作答
    const dot = S.st.level === 1;
    // 難度 3：每題打亂按鈕位置，不能靠記住「紅色在左上」反射作答
    const order = S.st.level === 3 ? shuffle([...COLORS]) : COLORS;
    pad.innerHTML = order.map(c => `<button class="sw" data-v="${c.k}">${dot ? `<i style="background:${c.v}"></i>` : ''}${c.n}</button>`).join('');
  } else if(q.mode === 'choice' && q.options.length === 3){
    pad.className = 'pad g3x';
    pad.innerHTML = q.options.map((v, i) => `<button data-v="${v}"><small>${HANDS[i]}</small>${v}</button>`).join('');
  } else if(q.mode === 'choice'){
    pad.className = 'pad g2';
    pad.innerHTML = q.options.map(v => `<button data-v="${v}">${v}</button>`).join('');
  } else {
    pad.className = 'pad g3 kp';
    pad.innerHTML = `<div class="entry" id="entry">&nbsp;</div>` +
      [1,2,3,4,5,6,7,8,9].map(d => `<button data-k="${d}">${d}</button>`).join('') +
      `<button data-k="del" aria-label="刪除">⌫</button><button data-k="0">0</button><button class="go" data-k="ok" aria-label="送出">✓</button>`;
  }
  fitStage();
}

$('#pad').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || !S || !S.cur) return;
  const q = S.cur;
  if(b.dataset.k !== undefined){
    const k = b.dataset.k;
    if(k === 'del') S.entry = S.entry.slice(0,-1);
    else if(k === 'ok'){ if(S.entry !== '') submit(+S.entry, 'tap'); return; }
    else if(S.entry.length < 4) S.entry += k;
    $('#entry').innerHTML = S.entry || '&nbsp;';
    return;
  }
  const v = b.dataset.v;
  if(q.kind === 'bool') submit(v === '1', 'tap');
  else if(q.kind === 'color') submit(v, 'tap');
  else submit(+v, 'tap');
});

function submit(val, via, t0){
  if(!S || !S.active || S.locked) return;
  try{ window.speechSynthesis && window.speechSynthesis.speaking && window.speechSynthesis.cancel(); }catch(e){}
  S.locked = true; clearTimeout(S.timer);
  const now = performance.now();
  // 手勢作答：反應時間算到「手舉過肩」的那一刻，不含停留確認的時間
  const rt = Math.max(0, (t0 || now) - (S.qStart || S.shownAt));
  const q = S.cur;
  const ok = val === q.answer;
  S.log.push({type:q.type, mode:q.mode, label:q.label, answer:fmt(q, q.answer), given:fmt(q, val), ok, rt:Math.round(rt), timeout:false, via});
  feedback(ok);
}
function onTimeout(){
  if(!S || !S.active || S.locked) return;
  S.locked = true;
  const q = S.cur;
  S.log.push({type:q.type, mode:q.mode, label:q.label, answer:fmt(q, q.answer), given:'', ok:false, rt:S.st.limit*1000, timeout:true, via:''});
  feedback(false);
}
function fmt(q, v){
  if(q.kind === 'bool') return v ? '對' : '錯';
  if(q.kind === 'color'){ const c = colorByK(v); return c ? c.n : String(v); }
  return String(v);
}
function feedback(ok){
  beep(ok);
  $('#stage').classList.add(ok ? 'ok' : 'bad');
  setTimeout(nextQ, ok ? 350 : 650);
}

function loop(){
  cancelAnimationFrame(raf);
  const tick = () => {
    if(!S || !S.active) return;
    const now = performance.now(), el = now - S.t0, st = S.st;
    const total = LEN_MS[st.len];
    const show = total ? Math.max(0, total - el) : el;
    const sec = total ? Math.ceil(show/1000) : Math.floor(show/1000);
    $('#rClock').textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
    let frac = 1;
    if(st.limit && S.qStart && !S.locked) frac = Math.max(0, 1 - (now - S.qStart)/(st.limit*1000));
    else if(total) frac = Math.max(0, 1 - el/total);
    else if(st.len === 'q20') frac = 1 - S.log.length/20;
    $('#tbar').style.transform = `scaleX(${frac})`;
    if(total && el >= total && !S.locked){ endSession(); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

function endSession(){
  if(!S || !S.active) return;
  S.active = false; clearTimeout(S.timer); clearTimeout(S.cdTimer); cancelAnimationFrame(raf);
  if(S.st.gesture){ gStop(); $('#gbox').hidden = true; $('#stagewrap').className = 'stagewrap'; }
  if(S.counting){
    try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null;
    show('setup'); return;
  }
  try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
  try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null;
  renderResult();
  show('result');
}

/* ---------- results ---------- */
function summarize(log){
  const n = log.length, okRows = log.filter(r => r.ok);
  const acc = n ? okRows.length / n : 0;
  const rt = okRows.length ? okRows.reduce((s,r) => s + r.rt, 0) / okRows.length : null;
  return {n, acc, rt, to: log.filter(r => r.timeout).length};
}
function pct(x){ return Math.round(x*100) + '%'; }
function secs(ms){ return ms == null ? '–' : (ms/1000).toFixed(2); }

function renderResult(){
  const {st, log} = S;
  const sm = summarize(log);
  $('#resTitle').textContent = st.name ? `${st.name} 的結果` : '本次結果';
  $('#resMeta').textContent = `${st.types.map(t => TYPE_NAME[t]).join('＋')}・難度 ${st.level}・` +
    `${st.modes.map(m => MODE_NAME[m]).join('＋')}題${st.gesture ? '（手勢）' : ''}・時限 ${st.limit ? st.limit + ' 秒' : '不限'}`;
  $('#kAcc').textContent = sm.n ? pct(sm.acc) : '–';
  $('#kRt').textContent = secs(sm.rt);
  $('#kN').textContent = sm.n;
  $('#kTo').textContent = sm.to;
  const types = [...new Set(log.map(r => r.type))];
  $('#byType').innerHTML = '<tr><th>題型</th><th>題數</th><th>正確率</th><th>平均反應(秒)</th></tr>' +
    types.map(t => { const s = summarize(log.filter(r => r.type === t)); return `<tr><td>${TYPE_NAME[t]}</td><td>${s.n}</td><td>${pct(s.acc)}</td><td>${secs(s.rt)}</td></tr>`; }).join('');
  $('#detail').innerHTML = '<tr><th>#</th><th>題目</th><th>正解</th><th>作答</th><th>秒</th></tr>' +
    log.map((r,i) => `<tr><td>${i+1}</td><td>${esc(r.label)}</td><td>${esc(r.answer)}</td><td class="${r.ok?'y':'n'}">${r.timeout ? '逾時' : esc(r.given)}</td><td>${secs(r.rt)}</td></tr>`).join('');
  $('#csvBox').hidden = true;
  if(sm.n){
    let h = []; try{ h = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); }catch(e){}
    h.unshift({d:new Date().toISOString(), name:st.name, types:st.types, level:st.level, n:sm.n, acc:sm.acc, rt:sm.rt});
    try{ localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0,30))); }catch(e){}
  }
  renderHist();
}

function toCSV(){
  const head = ['no','athlete','type','mode','question','answer','given','correct','rt_ms','timeout','via'];
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  return [head.join(',')].concat(S.log.map((r,i) => [i+1, S.st.name, r.type, r.mode, r.label, r.answer, r.given, r.ok?1:0, r.rt, r.timeout?1:0, r.via].map(q).join(','))).join('\n');
}
$('#csvBtn').addEventListener('click', () => {
  const text = toCSV(), box = $('#csvBox'), btn = $('#csvBtn');
  const fallback = () => { box.hidden = false; box.value = text; box.focus(); box.select(); btn.textContent = '已選取，請手動複製'; };
  try{
    navigator.clipboard.writeText(text).then(() => { btn.textContent = '已複製'; setTimeout(() => btn.textContent = '複製 CSV（貼到試算表）', 1800); }, fallback);
  }catch(e){ fallback(); }
});

function readHist(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); }catch(e){ return []; } }
function writeHist(h){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(h)); }catch(e){} }
function renderHist(){
  const h = readHist();
  const el = $('#hist');
  $('#clearHist').hidden = !h.length;
  if(!h.length){ el.innerHTML = '<p class="note" style="padding-top:10px">還沒有紀錄。完成一輪訓練後會出現在這裡。</p>'; return; }
  el.innerHTML = h.map(r => {
    const d = new Date(r.d);
    const when = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `<div class="h"><div class="meta"><b style="color:var(--ink);font-weight:500">${esc(r.name || '未命名')}</b>　${when}<br>${r.types.map(t => TYPE_NAME[t]).join('＋')}・難度${r.level}・${r.n}題</div><div class="num">${pct(r.acc)}</div><div class="num">${secs(r.rt)}s</div><button class="del" data-del="${esc(r.d)}" aria-label="刪除這筆紀錄">✕</button></div>`;
  }).join('');
}
$('#hist').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if(!b) return;
  writeHist(readHist().filter(r => r.d !== b.dataset.del));
  renderHist();
});
let clearArmTimer = 0;
$('#clearHist').addEventListener('click', () => {
  const btn = $('#clearHist');
  const reset = () => { clearTimeout(clearArmTimer); btn.classList.remove('arm'); btn.textContent = '清除全部'; };
  if(!btn.classList.contains('arm')){
    btn.classList.add('arm'); btn.textContent = '再按一次確認清除';
    clearArmTimer = setTimeout(reset, 3000);
    return;
  }
  reset(); writeHist([]); renderHist();
});

/* ---------- wiring ---------- */
$('#startBtn').addEventListener('click', startSession);
$('#stopBtn').addEventListener('click', endSession);
$('#againBtn').addEventListener('click', startSession);
$('#backBtn').addEventListener('click', () => show('setup'));
document.querySelectorAll('input[name=level]').forEach(i => i.addEventListener('change', updateLevelNote));

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && S && S.active && navigator.wakeLock){
    navigator.wakeLock.request('screen').then(l => wakeLock = l).catch(()=>{});
  }
});
function syncGestureUI(){
  const on = $('#gesture').checked;
  $('#gopts').hidden = !on;
  $('#modeNote').hidden = !on;
  const sh = $('#m-short');
  sh.disabled = on;
  sh.closest('.chip').style.opacity = on ? .4 : 1;
  if(!on) closeGestureTest();
}
function closeGestureTest(){
  if(!$('#gtest').hidden){ gStop(); }
  $('#gtest').hidden = true; $('#gtestBtn').hidden = false;
}
$('#gesture').addEventListener('change', syncGestureUI);
$('#gtestBtn').addEventListener('click', () => {
  $('#gtest').hidden = false; $('#gtestBtn').hidden = true;
  gUse('test');
  gInit(msg => { $('#gtestNote').textContent = msg; })
    .then(() => { if($('#gtest').hidden && !(S && S.active)) gStop(); })
    .catch(err => { $('#gtestNote').textContent = gErrText(err); });
});
$('#gtestClose').addEventListener('click', closeGestureTest);
$('#startBtn').addEventListener('click', () => { if(!$('#gtest').hidden){ G.onPose = null; $('#gtest').hidden = true; $('#gtestBtn').hidden = false; } }, true);
loadPrefs(); updateLevelNote(); syncGestureUI(); renderHist();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
